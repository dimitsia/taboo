<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taboo - GAMERS EDITION</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; text-align: center; margin: 0; padding: 0; user-select: none; }
        
        /* --- SPLASH SCREEN STYLES --- */
        #splash-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%); /* Light Blue/White PAS GIANNINA */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            cursor: pointer;
            transition: opacity 0.5s;
        }

        .splash-content {
            padding: 30px;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
        }

        .splash-title {
            font-size: 3.5em;
            font-weight: 900;
            color: #d32f2f; /* Red for Taboo highlight */
            letter-spacing: 5px;
            margin-bottom: 20px;
            text-shadow: 2px 2px #333;
        }

        .pas-logo-text {
            font-size: 2em;
            font-weight: bold;
            color: #1565c0; /* Deep Blue */
            margin: 15px 0 30px 0;
            padding-bottom: 5px;
            border-bottom: 3px solid #1565c0;
            display: inline-block;
        }
        
        .pas-logo-icon {
            font-size: 3em;
            color: #1565c0;
        }

        .creator-text {
            font-size: 1.1em;
            color: #666;
            margin-top: 30px;
            font-weight: 600;
        }

        /* --- GAME CONTAINER STYLES --- */
        .container { 
            max-width: 600px; 
            margin: 20px auto; 
            background: white; 
            padding: 20px; 
            border-radius: 15px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            
            /* Κρύβουμε τον περιέκτη του παιχνιδιού στην αρχή */
            opacity: 0; 
            pointer-events: none; 
            transition: opacity 0.5s;
        }
        
        .container.active {
            /* Τον εμφανίζουμε όταν φύγει το splash screen */
            opacity: 1;
            pointer-events: auto;
        }

        /* Scoreboard */
        .scoreboard { display: flex; justify-content: space-around; margin-bottom: 20px; padding: 10px; background: #eee; border-radius: 10px; }
        .team { padding: 10px 20px; border-radius: 8px; font-weight: bold; width: 40%; transition: 0.3s; position: relative; } /* Προσθήκη position: relative */
        .team-a { color: #d32f2f; border: 2px solid transparent; }
        .team-b { color: #1976d2; border: 2px solid transparent; }
        .active-team-a { background-color: #ffebee; border-color: #d32f2f; transform: scale(1.05); }
        .active-team-b { background-color: #e3f2fd; border-color: #1976d2; transform: scale(1.05); }
        .score { font-size: 2em; display: block; }
        
        /* Round Counter Styling */
        .round-counter {
            font-size: 0.8em;
            font-weight: normal;
            display: block;
            color: #666;
            margin-top: 5px;
        }
        
        .game-over-text {
            font-size: 2.5em;
            font-weight: bold;
            color: #d32f2f;
            text-shadow: 1px 1px 5px rgba(0,0,0,0.3);
            margin: 30px 0;
            padding: 20px;
            background: #fff8e1;
            border-radius: 10px;
            border: 3px solid #ffcc80;
        }

        /* Timer */
        #timer { font-size: 3em; font-weight: bold; color: #333; margin: 10px 0; }
        .time-low { color: #d32f2f !important; animation: pulse 1s infinite; }

        /* Card Design */
        .card-area { color: white; padding: 30px; border-radius: 15px; margin-bottom: 20px; min-height: 280px; display: flex; flex-direction: column; justify-content: center; position: relative; transition: background 0.5s; }
        
        /* Dynamic Backgrounds based on team */
        .bg-team-a { background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%); }
        .bg-team-b { background: linear-gradient(135deg, #2193b0 0%, #6dd5ed 100%); }
        
        /* ΧΡΩΜΑ ΓΙΑ ΤΗΝ ΟΘΟΝΗ ΕΝΑΡΞΗΣ (Παιχνιδιάρικο) */
        .bg-neutral { 
            background: linear-gradient(135deg, #ff9800 0%, #ffc107 100%); /* Πορτοκαλί / Κίτρινο */
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        
        .hidden-card { cursor: pointer; color: white; display: flex; align-items: center; justify-content: center; }
        .hidden-text { 
            font-size: 1.5em; 
            font-weight: bold; 
            white-space: pre-line; 
            color: white; 
            text-shadow: 1px 1px 3px rgba(0,0,0,0.7); /* Σκούρα σκιά για να ξεχωρίζει στο φως πορτοκαλί */
        }
        
        #target-word { font-size: 2.2em; font-weight: 900; text-transform: uppercase; margin-bottom: 15px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); border-bottom: 2px solid rgba(255,255,255,0.3); padding-bottom: 10px; }
        .forbidden-list { list-style: none; padding: 0; font-size: 1.3em; line-height: 1.5; }
        .forbidden-list li { color: #fff; font-weight: 500; text-shadow: 1px 1px 2px rgba(0,0,0,0.2); }

        /* Controls */
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        button { border: none; padding: 20px; font-size: 1.2em; border-radius: 10px; cursor: pointer; font-weight: bold; color: white; transition: transform 0.1s; }
        button:active { transform: scale(0.98); }
        
        .btn-correct { background-color: #4caf50; box-shadow: 0 4px #388e3c; }
        .btn-taboo { background-color: #f44336; box-shadow: 0 4px #d32f2f; }
        .btn-skip { background-color: #ff9800; box-shadow: 0 4px #f57c00; grid-column: span 2; margin-top: 10px; }

        /* Animations */
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .hidden { display: none; }

        /* Footer info */
        .footer-info { margin-top: 20px; font-size: 0.9em; color: #666; font-weight: bold;}
    </style>
</head>
<body>

<div id="splash-screen" onclick="hideSplash()">
    <div class="splash-content">
        <div class="splash-title">T A B O O</div>
        <div class="pas-logo-icon">⚽</div>
        <div class="pas-logo-text">GAMERS EDITION</div>
        <div class="creator-text">Created by Dimi Tsia</div>
        <div style="margin-top: 40px; font-size: 1.2em; color: #1565c0;">(Πατήστε για να συνεχίσετε)</div>
    </div>
</div>

    <div id="game-controls" class="controls hidden">

        <button class="btn-taboo" onclick="handleScore(-1)">✖ TABOO (-1)</button>

    </div>

    <div class="footer-info">

</div>

    let currentTeam = 'A'; // 'A' or 'B'
    let timer = 60;
    let timerInterval;
    let isPlaying = false;
    let isGameOver = false; 
    
    // Game Rounds Logic
    const MAX_ROUNDS = 10;
    let roundsA = 0;
    let roundsB = 0;

    // Μία κοινή τράπουλα για ΟΛΟ το παιχνίδι: καμία λέξη δεν επαναλαμβάνεται.
    let gameDeck = [];
    let usedWords = new Set();

    function normalizeWord(word) {
        return word.normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim().toUpperCase();
    }

    function buildUniqueDeck() {
        const allCards = [...cardsListA, ...cardsListB, ...extraCards];
        const unique = new Map();
        allCards.forEach(card => {
            const key = normalizeWord(card.word);
            if (!unique.has(key)) unique.set(key, card);
        });
        usedWords.clear();
        return shuffle([...unique.values()]);
    }

    // --- UTILITIES ---
    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function initGame() {
        // Ενιαία τράπουλα, καθαρισμένη από διπλότυπες λέξεις και ανακατεμένη.
        gameDeck = buildUniqueDeck();
        updateUI();
    }

    // --- UI UPDATES ---
    function updateUI() {
        document.getElementById('score-a').innerText = teamAScore;
        document.getElementById('score-b').innerText = teamBScore;
        document.getElementById('rounds-a').innerText = roundsA;
        document.getElementById('rounds-b').innerText = roundsB;
        
        const boxA = document.getElementById('team-a-box');
        const boxB = document.getElementById('team-b-box');
        const cardArea = document.getElementById('game-card');
        
        // Update active team visual
        if (currentTeam === 'A') {
            boxA.classList.add('active-team-a');
            boxB.classList.remove('active-team-b');
            cardArea.classList.remove('bg-team-b');
            cardArea.classList.add('bg-team-a');
        } else {
            boxA.classList.remove('active-team-a');
            boxB.classList.add('active-team-b');
            cardArea.classList.remove('bg-team-a');
            cardArea.classList.add('bg-team-b');
        }
        updateCardsLeft();
    }
    
    function updateCardsLeft() {
        document.getElementById('cards-left').innerText = gameDeck.length;
    }

    // --- GAME FLOW ---
    function startGame() {
        if (isGameOver) return;
        
        const currentRounds = currentTeam === 'A' ? roundsA : roundsB;
        if (currentRounds >= MAX_ROUNDS) {
            // If current team has finished rounds, try switching to the other team if they haven't finished
            const otherTeamRounds = currentTeam === 'A' ? roundsB : roundsA;
            if (otherTeamRounds < MAX_ROUNDS) {
                currentTeam = currentTeam === 'A' ? 'B' : 'A';
                updateUI();
                startGame(); // Restart function with the other team
                return;
            } else {
                endGame();
                return;
            }
        }

        
        isPlaying = true;
        timer = 60;
        updateUI(); 
        
        document.getElementById('timer').innerText = timer;
        document.getElementById('timer').classList.remove('time-low');
        
        document.getElementById('start-overlay').classList.add('hidden');
        document.getElementById('game-card').classList.remove('hidden');
        document.getElementById('game-controls').classList.remove('hidden');
        document.getElementById('game-over-overlay').classList.add('hidden');


        nextCard();
        
        timerInterval = setInterval(() => {
            timer--;
            const timerDisplay = document.getElementById('timer');
            timerDisplay.innerText = timer;
            
            if(timer <= 10) timerDisplay.classList.add('time-low');

            if (timer <= 0) {
                endTurn();
            }
        }, 1000);
    }

    function nextCard() {
        // Αν εξαντληθούν ΟΛΕΣ οι μοναδικές κάρτες, τότε και μόνο τότε ξεκινά νέος κύκλος.
        if (gameDeck.length === 0) {
            alert("Παίχτηκαν όλες οι διαθέσιμες λέξεις! Ξεκινά νέος κύκλος με νέο ανακάτεμα.");
            gameDeck = buildUniqueDeck();
        }

        const card = gameDeck.pop();
        usedWords.add(normalizeWord(card.word));
        updateCardsLeft();

        document.getElementById('target-word').innerText = card.word;
        const list = document.getElementById('forbidden-words');
        list.innerHTML = '';
        card.taboo.forEach(word => {
            const li = document.createElement('li');
            li.innerText = word;
            list.appendChild(li);
        });
    }

    function handleScore(points) {
        if (!isPlaying) return;
        
        if (currentTeam === 'A') {
            teamAScore += points;
        } else {
            teamBScore += points;
        }
        
        updateUI();
        nextCard();
    }

    function skipCard() {
        if (!isPlaying) return;
        nextCard();
    }

    function endTurn() {
        clearInterval(timerInterval);
        isPlaying = false;
        
        // Increment round count for the team that just finished
        if (currentTeam === 'A') {
            roundsA++;
        } else {
            roundsB++;
        }
        updateUI(); // Update round counter display

        document.getElementById('game-card').classList.add('hidden');
        document.getElementById('game-controls').classList.add('hidden');
        document.getElementById('start-overlay').classList.remove('hidden');
        
        // Check if game should end
        if (roundsA >= MAX_ROUNDS && roundsB >= MAX_ROUNDS) {
            endGame();
            return;
        }

        // Switch team
        let nextTeam = currentTeam === 'A' ? 'B' : 'A';
        
        // Check if next team has already completed its rounds
        let nextTeamRounds = nextTeam === 'A' ? roundsA : roundsB;
        if (nextTeamRounds >= MAX_ROUNDS) {
            // If the next team has finished, switch back to the original team (if they have rounds left)
            let finalNextTeam = currentTeam; 
            let finalNextTeamRounds = currentTeam === 'A' ? roundsA : roundsB;
            
            if (finalNextTeamRounds < MAX_ROUNDS) {
                // This scenario shouldn't happen immediately after incrementing, but is a safety check.
                // We must switch to the team with rounds left.
                finalNextTeam = currentTeam === 'A' ? 'B' : 'A'; // Go back to the other team's perspective
            } else {
                // Should have been caught by the overall game end check
                endGame();
                return;
            }
            nextTeam = finalNextTeam;
        }
        
        currentTeam = nextTeam;
        updateUI();
        
        const teamName = currentTeam === 'A' ? 'ΟΜΑΔΑ Α' : 'ΟΜΑΔΑ Β';
        const currentRounds = currentTeam === 'A' ? roundsA : roundsB;
        
        document.querySelector('.hidden-text').innerText = `ΤΕΛΟΣ ΧΡΟΝΟΥ! (Γύρος ${currentRounds}/${MAX_ROUNDS})\nΣΕΙΡΑ: ${teamName}\nΠΑΤΗΣΤΕ ΓΙΑ ΕΝΑΡΞΗ`;


        try {
            if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
        } catch(e){}

        alert("Τέλος Χρόνου! Αλλάξτε ομάδα.");
    }
    
    function endGame() {
        isGameOver = true;
        clearInterval(timerInterval);
        document.getElementById('start-overlay').classList.add('hidden');
        document.getElementById('game-card').classList.add('hidden');
        document.getElementById('game-controls').classList.add('hidden');
        document.getElementById('timer').classList.add('hidden');
        document.getElementById('game-over-overlay').classList.remove('hidden');

        let winnerText;
        if (teamAScore > teamBScore) {
            winnerText = `Νικήτρια η ΟΜΑΔΑ Α με ${teamAScore} - ${teamBScore}!`;
        } else if (teamBScore > teamAScore) {
            winnerText = `Νικήτρια η ΟΜΑΔΑ Β με ${teamBScore} - ${teamAScore}!`;
        } else {
            winnerText = `Ισοπαλία! ${teamAScore} - ${teamBScore}!`;
        }
        
        document.getElementById('final-winner').innerText = winnerText;
    }


    // --- SPLASH SCREEN LOGIC ---
    function hideSplash() {
        document.getElementById('splash-screen').style.opacity = '0';
        document.getElementById('game-container').classList.add('active');

        setTimeout(() => {
            document.getElementById('splash-screen').style.display = 'none';
            // Set initial screen text correctly after splash is hidden
            const teamName = currentTeam === 'A' ? 'ΟΜΑΔΑ Α' : 'ΟΜΑΔΑ Β';
            const currentRounds = currentTeam === 'A' ? roundsA : roundsB;
            document.querySelector('.hidden-text').innerText = `ΠΑΤΗΣΤΕ ΓΙΑ ΕΝΑΡΞΗ\nΣΕΙΡΑ: ${teamName} (Γύρος ${currentRounds}/${MAX_ROUNDS})`;
        }, 500);
    }


    // Initialize
    initGame();

</script>
